<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="みならいパンダのおっちょこちょい飯店 ヒント">
  <title>ヒント | おっちょこちょい飯店</title>
  <link rel="icon" type="image/png" sizes="48x48" href="../../assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-tenshin">
  <div class="tenshin-sheet">
    <p class="tenshin-hero">
      <img src="../tenshin_title.png" alt="みならいパンダ、開店準備中。みならいパンダのおっちょこちょい飯店" width="4093" height="2894">
    </p>

    <main class="tenshin-wrap">
      <section class="tenshin-intro" aria-labelledby="hint-title">
        <h1 id="hint-title"></h1>
        <p class="tenshin-thanks" id="hint-thanks"></p>
        <section class="tenshin-notes-box" aria-labelledby="hint-notes-title">
          <h2 id="hint-notes-title"></h2>
          <ul id="hint-notes"></ul>
        </section>
      </section>
      <div id="hint-steps"></div>
      <p>
        <a class="tenshin-btn" id="hint-back" href="../">解答へ</a>
      </p>
    </main>
  </div>

  <footer class="site-footer">
    <p class="copyright">&copy; 2026 ShareKOBE Inc. All rights reserved.</p>
  </footer>

  <script>
    const HINT = {
      title: "ヒント",
      thanks: "行き詰まったときは、該当の品のヒントを確認してください。",
      notesTitle: "注意事項",
      notes: [
        "内容のネタバレに繋がる行為はお控えください。",
        "本キットの転売は固く禁止いたします。",
      ],
      backLabel: "解答へ",
      steps: [
        { label: "一品目", body: "" },
        { label: "二品目", body: "" },
        { label: "三品目", body: "" },
        { label: "四品目", body: "" },
        { label: "お会計", body: "" },
      ],
    };

    (function () {
      const data = HINT;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      document.getElementById("hint-title").textContent = data.title || "ヒント";
      document.getElementById("hint-thanks").textContent = data.thanks || "";
      document.getElementById("hint-notes-title").textContent = data.notesTitle || "注意事項";
      document.getElementById("hint-notes").innerHTML = (data.notes || [])
        .map((line) => `<li>${escapeHtml(line)}</li>`)
        .join("");
      const back = document.getElementById("hint-back");
      if (back && data.backLabel) back.textContent = data.backLabel;

      document.getElementById("hint-steps").innerHTML = (data.steps || [])
        .map(
          (step) => `
        <section class="tenshin-step">
          <h2 class="tenshin-step-bar">${escapeHtml(step.label)}</h2>
          ${step.body ? `<p class="tenshin-q">${escapeHtml(step.body)}</p>` : ""}
        </section>`
        )
        .join("");
    })();
  </script>
</body>
</html>
