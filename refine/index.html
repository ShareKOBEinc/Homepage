<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>refine 解答ページ｜ShareKOBE</title>
<!-- 解答ページはネタバレを含むので検索に出さない。Xのカードは share/ に任せる -->
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>/* refine ／ ShareKOBE 共通スタイル
   色はキービジュアル・問題画像から抽出。STEPごとの色は問題画像のラベル色に合わせている */
:root {
  --bg: #262626;          /* ロゴ画像の背景色と一致させる */
  --bg-2: #303030;
  --fg: #f3ece0;
  --muted: #a89f8c;
  --gold-1: #f7dc94;          /* ロゴのグラデーション明部 */
  --gold-2: #c9a24a;          /* ロゴのグラデーション暗部 */
  --gold: linear-gradient(135deg, var(--gold-1), var(--gold-2));
  --yellow: #d9c832;          /* キービジュアルの市松の黄 */
  --paper: #f3e9ea;           /* 問題画像の紙色 */
  --ink: #3a3426;
  --ok: #9bd36b;
  --ng: #ff7a7a;

  /* STEPカラー（ラベル背景 / ラベル文字） */
  --s1-bg: #1b4a3c; --s1-fg: #f08a4b;
  --s2-bg: #2b3a55; --s2-fg: #c3d93a;
  --s3-bg: #3a3426; --s3-fg: #ff7a7a;
  --sl-bg: #111820; --sl-fg: #d7bf6a;

  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); line-height: 1.8;
  -webkit-text-size-adjust: 100%;
}
/* 背景：キービジュアルの斜め市松をごく薄く */
body::before {
  content: ""; position: fixed; inset: -50%; z-index: -1;
  background: repeating-conic-gradient(var(--yellow) 0 25%, transparent 0 50%) 0 0 / 72px 72px;
  opacity: .05; transform: rotate(-28deg);
  pointer-events: none;
}

main { max-width: 600px; margin: 0 auto; padding: 32px 16px 80px; }
img { max-width: 100%; display: block; }
a { color: var(--gold-1); }

/* ヘッダー */
.site-header { text-align: center; padding: 8px 0 24px; }
.site-header .logo { width: min(320px, 80%); margin: 0 auto; }
.catch {
  font-family: var(--serif); font-weight: 700; letter-spacing: .2em;
  font-size: clamp(1rem, 4.2vw, 1.25rem); margin: 8px 0 0;
}
.lead { color: var(--muted); font-size: .92rem; text-align: center; }

/* STEPカード */
.step {
  --c-bg: var(--s1-bg); --c-fg: var(--s1-fg);
  background: var(--bg-2); border-radius: 16px; padding: 20px;
  margin: 28px 0; border-top: 6px solid var(--c-bg);
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
  scroll-margin-top: 16px;
}
.step[data-step="2"] { --c-bg: var(--s2-bg); --c-fg: var(--s2-fg); }
.step[data-step="3"] { --c-bg: var(--s3-bg); --c-fg: var(--s3-fg); }
.step[data-step="last"] { --c-bg: var(--sl-bg); --c-fg: var(--sl-fg); border-top-color: var(--gold-2); }

.label {
  display: inline-block; font-family: var(--serif); font-weight: 700;
  letter-spacing: .08em; padding: 4px 20px; border-radius: 999px;
  background: var(--c-bg); color: var(--c-fg); margin: 0 0 12px;
  font-size: 1rem;
}
.step.locked { display: none; }
.step.reveal { animation: rise .6s ease-out; }
.step .note { font-size: .88rem; color: var(--muted); margin: 0; }

.answer { display: flex; gap: 8px; margin-top: 14px; }
.answer input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; /* iOSのズーム防止 */
  padding: 12px 14px; border-radius: 10px;
  border: 1px solid #555; background: #151515; color: var(--fg);
}
.answer input:focus { outline: 2px solid var(--gold-2); border-color: transparent; }
.answer input:disabled { opacity: .6; }

.btn {
  font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 10px;
  padding: 12px 18px; color: #1f1a0e; background: var(--gold);
  text-decoration: none; display: inline-block; text-align: center;
}
.btn:disabled { filter: grayscale(.8); cursor: default; }
.btn.block { display: block; width: 100%; padding: 15px; margin: 12px 0; font-size: 1.05rem; }
.btn.x { background: #000; color: #fff; border: 1px solid #444; }
.btn.ghost { background: transparent; color: var(--gold-1); border: 1px solid var(--gold-2); }

.msg { min-height: 1.8em; margin: 8px 0 0; font-weight: 700; }
.msg.ok { color: var(--ok); }
.msg.ng { color: var(--ng); }
.hint-link { font-size: .88rem; color: var(--muted); }

/* クリア */
#clear { display: none; text-align: center; padding: 8px 0; }
#clear.show { display: block; animation: rise .7s ease-out; }
#clear h2 {
  font-family: var(--serif); font-size: clamp(2rem, 10vw, 3rem); letter-spacing: .25em;
  margin: 16px 0 0; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent;
}
#clear .clear-img { width: 100%; border-radius: 14px; margin: 18px 0; box-shadow: 0 0 0 1px var(--gold-2), 0 10px 40px rgba(201,162,74,.25); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ヒント */
.hint-block details { border-top: 1px solid #3a3a3a; padding: 10px 0; }
.hint-block summary { cursor: pointer; font-weight: 700; color: var(--c-fg); }
.hint-block .step:target { box-shadow: 0 0 0 2px var(--gold-2), 0 6px 24px rgba(0,0,0,.35); }
.warn { color: var(--ng); font-size: .88rem; }

/* シェア用ページの商品情報 */
.info {
  display: grid; grid-template-columns: auto 1fr; gap: 10px 16px;
  text-align: left; background: var(--bg-2); border-radius: 14px;
  padding: 20px; margin: 24px 0; border-top: 4px solid var(--gold-2);
}
.info dt { font-family: var(--serif); font-weight: 700; color: var(--gold-1); }
.info dd { margin: 0; }

.site-footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 48px; }
.site-footer img { width: 140px; margin: 0 auto 8px; opacity: .8; }
</style>
</head>

  // ==========================================

  document.getElementById("shop-btn").href = SHOP_URL;

  // 表記ゆれを吸収：全角/半角、カタカナ→ひらがな、空白、大文字小文字
  function normalize(s) {
    return s.normalize("NFKC").trim().toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function save(key) { try { localStorage.setItem("refine-" + key, "1"); } catch (e) {} }
  function load(key) { try { return localStorage.getItem("refine-" + key) === "1"; } catch (e) { return false; } }

  function markSolved(q) {
    const msg = q.querySelector(".msg");
    msg.textContent = "正解！";
    msg.className = "msg ok";
    q.querySelector("input").disabled = true;
    q.querySelector("button").disabled = true;
  }

  // 次のSTEPを表示する
  function unlockNext(q, scroll) {
    const next = q.nextElementSibling;
    if (!next || !next.classList.contains("locked")) return;
    next.classList.remove("locked");
    if (scroll) {
      next.classList.add("reveal");
      next.scrollIntoView({ behavior: "smooth", block: "start" });
      next.querySelector("input").focus({ preventScroll: true });
    }
  }

  function showClear(scroll) {
    const el = document.getElementById("clear");
    el.classList.add("show");
    if (scroll) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.querySelectorAll(".step").forEach(q => {
    const input = q.querySelector("input");
    const btn = q.querySelector("button");
    const msg = q.querySelector(".msg");
    const isFinal = q.hasAttribute("data-final");

    async function check() {
      const v = normalize(input.value);
      if (!v) return;
      if (await sha256(SALT + v) === q.dataset.hash) {
        markSolved(q);
        save(q.id);
        if (isFinal) showClear(true); else unlockNext(q, true);
      } else {
        msg.textContent = "ちがうようです…";
        msg.className = "msg ng";
      }
    }
    btn.addEventListener("click", check);
    input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) check(); });

    // 再訪時は正解状態を復元（上から順に処理されるので、解いたSTEPまで開いた状態に戻る）
    if (load(q.id)) { markSolved(q); if (isFinal) showClear(false); else unlockNext(q, false); }
  });

  // ポスト：スマホで画像付き共有ができれば画像添付、無理ならWeb Intent（share/ のカード表示）
  document.getElementById("post-btn").addEventListener("click", async () => {
    try {
      const blob = await (await fetch(CLEAR_IMG)).blob();
      const file = new File([blob], "refine_clear.png", { type: blob.type || "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: POST_TEXT + "\n" + SHARE_URL });
        return;
      }
    } catch (e) {
      if (e.name === "AbortError") return; // 共有シートを閉じた
    }
    const intent = "https://x.com/intent/post?text=" + encodeURIComponent(POST_TEXT)
                 + "&url=" + encodeURIComponent(SHARE_URL);
    window.open(intent, "_blank", "noopener");
  });
</script>
