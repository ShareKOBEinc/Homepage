<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShareKOBEへのお問い合わせ。映像・イベント・舞台の制作ご相談はこちら。">
  <title>Contact | ShareKOBE</title>
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/btf8drg.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="header scrolled" id="header">
    <a href="index.html" class="logo" aria-label="ShareKOBE ホームへ">
      <img src="assets/ShareKOBE_AI.webp" alt="ShareKOBE" class="logo__img" width="399" height="118">
    </a>
        <nav class="nav" aria-label="メインナビゲーション">
      <a href="news.html">News</a>
      <a href="about.html">About</a>
      <a href="works.html">Works</a>
      <a href="goods.html">Goods</a>
      <a href="contact.html" class="nav__active">Contact</a>
    </nav>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-expanded="false">
      <span></span>
      <span></span>
    </button>
  </header>

    <div class="mobile-nav" id="mobileNav" aria-hidden="true">
    <nav>
      <a href="news.html">News</a>
      <a href="about.html">About</a>
      <a href="works.html">Works</a>
      <a href="goods.html">Goods</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <main class="subpage">
    <section class="page-hero page-hero--compact">
      <a href="index.html" class="page-hero__back reveal">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M16 10H4M8 6l-4 4 4 4" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Back to Home
      </a>
      <h1 class="page-hero__title reveal">Contact</h1>
      <p class="page-hero__desc reveal">
        イベント制作等のご相談、お見積りのご依頼など、<br>
        お気軽にお問い合わせください。
      </p>
    </section>

    <section class="contact contact--page">
      <div class="contact__layout">
        <div class="contact__form-wrap reveal">
          <form
            class="contact__form"
            id="contactForm"
            action="https://formsubmit.co/sharekobe.sharekobe@gmail.com"
            method="POST"
          >
            <input type="hidden" name="_subject" value="ShareKOBE お問い合わせ">
            <input type="hidden" name="_template" value="table">
            <input type="text" name="_honey" class="form-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="form-row">
              <label for="name">お名前 <span class="form-required" aria-hidden="true">必須</span></label>
              <input type="text" id="name" name="name" required placeholder="山田 太郎" autocomplete="name">
            </div>
            <div class="form-row">
              <label for="company">会社名・団体名</label>
              <input type="text" id="company" name="company" placeholder="株式会社〇〇" autocomplete="organization">
            </div>
            <div class="form-row">
              <label for="email">メールアドレス <span class="form-required" aria-hidden="true">必須</span></label>
              <input type="email" id="email" name="email" required placeholder="example@email.com" autocomplete="email">
            </div>
            <div class="form-row">
              <label for="category">ご相談内容 <span class="form-required" aria-hidden="true">必須</span></label>
              <select id="category" name="category" class="form-select" required>
                <option value="" disabled selected>選択してください</option>
                <option value="制作依頼">制作依頼</option>
                <option value="ShareKOBEの作品について">ShareKOBEの作品について</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div class="form-row">
              <label for="message">お問い合わせ内容 <span class="form-required" aria-hidden="true">必須</span></label>
              <textarea id="message" name="message" rows="6" required placeholder="プロジェクトの概要、希望時期、予算感などをお聞かせください"></textarea>
            </div>
            <button type="submit" class="btn-submit">
              <span>送信</span>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__bottom">
      <p>&copy; 2026 ShareKOBE Inc. All rights reserved.</p>
      <div class="footer__social">
        <a href="https://x.com/shareKOBE_" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
          <img src="assets/logo-black.png" alt="" class="footer__social-icon" width="28" height="28">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
