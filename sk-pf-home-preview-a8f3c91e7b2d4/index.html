<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="ShareKOBE — イベント参加・グッズ購入のためのプレビューページ">
  <title>ShareKOBE | Participant Preview</title>
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://use.typekit.net/btf8drg.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site">
    <div class="pf-shell">
      <header class="pf-header">
        <a class="pf-logo" href="./" aria-label="ShareKOBE ホーム">
          <img src="../assets/ShareKOBE_AI.webp" alt="ShareKOBE" width="399" height="118">
        </a>
        <a class="pf-corp" href="/">法人・企業様はこちらから &gt;&gt;</a>
      </header>

      <nav class="pf-nav" aria-label="メインメニュー">
        <a class="pf-nav__item" href="#tickets">
          <img class="pf-nav__icon" src="../assets/events.svg" alt="" width="64" height="64">
          <span>EVENTS</span>
        </a>
        <a class="pf-nav__item" href="#goods">
          <img class="pf-nav__icon" src="../assets/goods.svg" alt="" width="64" height="64">
          <span>GOODS</span>
        </a>
        <a class="pf-nav__item" href="/about.html">
          <img class="pf-nav__icon" src="../assets/about.svg" alt="" width="64" height="64">
          <span>ABOUT</span>
        </a>
        <a class="pf-nav__item" href="/contact.html">
          <img class="pf-nav__icon" src="../assets/contact.svg" alt="" width="64" height="64">
          <span>CONTACT</span>
        </a>
      </nav>

      <section class="carousel" id="heroCarousel" aria-label="注目イベント">
        <button class="carousel__rail carousel__rail--prev" type="button" data-carousel="hero" data-dir="-1" aria-label="前のスライド">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4 6 12l10 8z"/></svg>
        </button>
        <div class="carousel__track" data-track="hero">
          <article class="carousel__slide">
            <img class="carousel__blur" src="../assets/ナゾカルタEXKV（大阪.jpg" alt="" aria-hidden="true">
            <img class="carousel__media" src="../assets/ナゾカルタEXKV（大阪.jpg" alt="ナゾカルタ EXPERT EDITION">
          </article>
          <article class="carousel__slide">
            <img class="carousel__blur" src="../assets/どっち謎KV（2026広島）.jpg" alt="" aria-hidden="true">
            <img class="carousel__media" src="../assets/どっち謎KV（2026広島）.jpg" alt="どっち謎 2026広島">
          </article>
          <article class="carousel__slide">
            <img class="carousel__blur" src="../assets/トキシラズKV.jpg" alt="" aria-hidden="true">
            <img class="carousel__media" src="../assets/トキシラズKV.jpg" alt="トキシラズ">
          </article>
        </div>
        <button class="carousel__rail carousel__rail--next" type="button" data-carousel="hero" data-dir="1" aria-label="次のスライド">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z"/></svg>
        </button>
      </section>

      <div class="pf-band">
        <section class="pf-section" id="tickets">
          <div class="pf-section__head">
            <h2>TICKETS</h2>
            <img class="pf-section__icon pf-section__icon--tickets" src="../assets/tickets.svg" alt="" width="56" height="56">
            <p class="cal__note">公演がある日は赤丸付きです。日付を選ぶと詳細が表示されます。</p>
          </div>
          <div class="cal-wrap">
            <div class="cal" id="ticketCal" data-year="2026" data-month="11">
              <div class="cal__bar">
                <button class="cal__nav" type="button" data-cal-dir="-1" aria-label="前の月">
                  <svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg>
                </button>
                <div class="cal__label" id="calLabel">2026年 11月</div>
                <button class="cal__nav" type="button" data-cal-dir="1" aria-label="次の月">
                  <svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg>
                </button>
              </div>
              <div class="cal__week" aria-hidden="true">
                <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="is-sat">土</span><span class="is-sun">日</span>
              </div>
              <div class="cal__grid" id="calGrid" role="grid" aria-labelledby="calLabel"></div>
            </div>

            <div class="cal-detail" id="calDetail" hidden>
              <p class="cal-detail__date" id="calDetailDate"></p>
              <div class="cal-detail__list" id="calDetailList"></div>
              <p class="cal-detail__empty" id="calDetailEmpty" hidden>この日の公演はありません。</p>
            </div>
          </div>
        </section>

        <section class="pf-section" id="goods">
          <div class="pf-section__head">
            <h2>GOODS</h2>
            <img class="pf-section__icon" src="../assets/goods.svg" alt="" width="40" height="40">
            <a class="pf-more" href="/goods.html">他のグッズもみる &gt;&gt;</a>
          </div>

          <div class="carousel" id="goodsCarousel" aria-label="おすすめグッズ">
            <button class="carousel__rail carousel__rail--prev" type="button" data-carousel="goods" data-dir="-1" aria-label="前のグッズ">
              <svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg>
            </button>
            <div class="carousel__track" data-track="goods">
              <article class="carousel__slide">
                <a href="/goods/refine.html">
                  <img class="carousel__blur" src="../assets/A4_refine.jpg" alt="" aria-hidden="true">
                  <img class="carousel__media" src="../assets/A4_refine.jpg" alt="refine">
                </a>
              </article>
              <article class="carousel__slide">
                <a href="/goods/tenshin.html">
                  <img class="carousel__blur" src="../assets/A4_tenshin.jpg" alt="" aria-hidden="true">
                  <img class="carousel__media" src="../assets/A4_tenshin.jpg" alt="点心爛漫!?みならいパンダのおっちょこちょい飯店">
                </a>
              </article>
              <article class="carousel__slide">
                <a href="/goods/oshiriddle.html">
                  <img class="carousel__blur" src="../assets/A4_oshiriddle.jpg" alt="" aria-hidden="true">
                  <img class="carousel__media" src="../assets/A4_oshiriddle.jpg" alt="おしりドル">
                </a>
              </article>
            </div>
            <button class="carousel__rail carousel__rail--next" type="button" data-carousel="goods" data-dir="1" aria-label="次のグッズ">
              <svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg>
            </button>
          </div>
        </section>
      </div>
    </div>

    <footer class="pf-footer">
      <p>&copy; 2026 ShareKOBE Inc. All rights reserved.</p>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
